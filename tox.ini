[tox]
envlist =
    quality
    py310-{42,50}
    py312-{42,50,60}
    py313-{50,60}
    py315-60

# tox-travis block: mark quality as part of the python3.12 build
[travis]
python =
    3.12: py312, quality

# tox-gh-actions block: map each GitHub Actions Python version to its tox envs
[gh-actions]
python =
    3.10: py310
    3.12: py312
    3.13: py313
    3.15: py315

# Generic specification for all unspecific environments
[testenv]
deps =
    codecov
    32: django >= 3.2.25, <4.0
    42: django >= 4.2.23, <5.0
    50: django >= 5.0, <6.0
    60: django >= 6.0, <7.0
extras = test
passenv = CI,TRAVIS,TRAVIS_*
commands =
    coverage run --branch --source=cspreports runtests.py
    codecov

# Specific environments
[testenv:quality]
allowlist_externals = make
basepython = python3.12
extras = quality
commands =
    make check-isort
    make check-flake8
